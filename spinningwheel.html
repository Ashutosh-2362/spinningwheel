<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spin The Wheel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg,
                    #f8f8fa 0%,
                    #f8f8fa 65%,
                    #eaf1f8 65%,
                    #eaf1f8 100%);

            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 30px;
        }

        .app {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: minmax(500px, 1fr) 350px;
            gap: 40px;
            align-items: center;
        }

        /* =============================
       WHEEL AREA
    ============================== */

        .wheel-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-wrapper {
            position: relative;
            width: min(78vw, 760px);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel-shadow {
            position: absolute;
            width: 94%;
            height: 94%;
            border-radius: 50%;
            box-shadow:
                0 18px 35px rgba(0, 0, 0, 0.16),
                0 4px 8px rgba(0, 0, 0, 0.08);
        }

        #wheel {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* pointer */

        .pointer {
            position: absolute;
            right: -32px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;

            border-top: 30px solid transparent;
            border-bottom: 30px solid transparent;
            border-right: 58px solid white;

            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.25));
            z-index: 20;
        }

        .pointer::after {
            content: "";
            position: absolute;

            top: -20px;
            right: -49px;

            width: 0;
            height: 0;

            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 41px solid #182238;
        }

        /* center button */

        .spin-button {
            position: absolute;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 140px;
            height: 140px;

            border-radius: 50%;

            border: 9px solid white;

            background: #182238;
            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-size: 23px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.25);

            z-index: 10;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .spin-button:hover {
            background: #243351;
            transform: translate(-50%, -50%) scale(1.04);
        }

        .spin-button:active {
            transform: translate(-50%, -50%) scale(0.96);
        }

        .spin-button:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .spin-icon {
            font-size: 34px;
            margin-bottom: 5px;
            line-height: 1;
        }

        /* =============================
       CONTROL PANEL
    ============================== */

       .control-panel {
    background: white;

    border-radius: 22px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.12);

    max-height: 80vh;

    /*
      Critical:
      clips the scrollbar inside
      the rounded card.
    */
    overflow: hidden;
}

.control-panel-scroll {
    max-height: 80vh;

    padding: 28px;

    overflow-y: auto;
    overflow-x: hidden;

    /*
      Optional but helps preserve
      the same rounded appearance.
    */
    border-radius: inherit;

    scrollbar-width: thin;
    scrollbar-color: #407ff0 #eef1f5;
}

        .control-panel h2 {
            font-size: 26px;
            margin-bottom: 7px;
            color: #172033;
        }

        .subtitle {
            color: #798293;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .input-row input {
            flex: 1;
            min-width: 0;

            padding: 13px 14px;

            border: 2px solid #e4e7ec;
            border-radius: 10px;

            font-size: 15px;
            outline: none;

            transition: border 0.2s ease;
        }

        .input-row input:focus {
            border-color: #407ff0;
        }

        .add-btn {
            border: none;
            padding: 0 18px;

            border-radius: 10px;

            background: #407ff0;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .add-btn:hover {
            background: #2e6cdc;
            transform: translateY(-1px);
        }

        .names-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .names-title h3 {
            color: #202b3c;
            font-size: 16px;
        }

        .name-count {
            background: #eef3ff;
            color: #407ff0;

            padding: 4px 9px;
            border-radius: 30px;

            font-size: 12px;
            font-weight: 700;
        }

        .names-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .name-item {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px 12px;

            border-radius: 10px;
            background: #f7f8fa;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .name-item:hover {
            background: #f0f3f8;
            transform: translateX(2px);
        }

        .color-dot {
            width: 13px;
            height: 13px;

            border-radius: 50%;

            flex-shrink: 0;
        }

        .name-text {
            flex: 1;
            color: #30394a;
            font-size: 14px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-btn {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 8px;

            background: #ffecec;
            color: #e54848;

            font-size: 17px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .delete-btn:hover {
            background: #ffdede;
            transform: scale(1.08);
        }





/* Chrome, Edge, Safari */

.control-panel-scroll::-webkit-scrollbar {
    width: 10px;
}

.control-panel-scroll::-webkit-scrollbar-track {
    background: #eef1f5;
}

.control-panel-scroll::-webkit-scrollbar-thumb {
    background: #407ff0;

    border-radius: 20px;

    border: 2px solid #eef1f5;
}

.control-panel-scroll::-webkit-scrollbar-thumb:hover {
    background: #2e6cdc;
}
        /* =============================
       POPUP
    ============================== */

        .popup-overlay {
            position: fixed;
            inset: 0;

            background: rgba(11, 17, 30, 0.62);
            backdrop-filter: blur(7px);

            display: flex;
            align-items: center;
            justify-content: center;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;

            z-index: 999;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            width: min(90%, 440px);

            background: white;

            border-radius: 24px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.3);

            transform: translateY(30px) scale(0.92);

            transition:
                transform 0.35s cubic-bezier(.17, .67, .33, 1.4);
        }

        .popup-overlay.active .popup {
            transform: translateY(0) scale(1);
        }

        .winner-icon {
            width: 85px;
            height: 85px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fff5cc;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;
        }

        .popup h4 {
            font-size: 17px;
            color: #818997;

            margin-bottom: 9px;
        }

        .winner-name {
            font-size: 34px;
            font-weight: 800;

            color: #172033;

            word-break: break-word;

            margin-bottom: 28px;
        }

        .close-popup {
            border: none;

            padding: 13px 30px;

            background: #182238;
            color: white;

            border-radius: 11px;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        /* =============================
       RESPONSIVE
    ============================== */

        @media (max-width: 1000px) {

            body {
                padding: 20px;
            }

            .app {
                grid-template-columns: 1fr;
            }

            .wheel-wrapper {
                width: min(90vw, 700px);
            }

            .control-panel {
                width: 100%;
                max-width: 700px;
                margin: auto;
                max-height: none;
            }
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .wheel-wrapper {
                width: 88vw;
            }

            .spin-button {
                width: 95px;
                height: 95px;

                border-width: 6px;

                font-size: 16px;
            }

            .spin-icon {
                font-size: 24px;
            }

            .pointer {
                right: -19px;

                border-top-width: 20px;
                border-bottom-width: 20px;
                border-right-width: 40px;
            }

            .pointer::after {
                top: -13px;
                right: -35px;

                border-top-width: 13px;
                border-bottom-width: 13px;
                border-right-width: 28px;
            }

            .control-panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- =========================
         WHEEL
    ========================== -->

        <section class="wheel-section">

            <div class="wheel-wrapper">

                <div class="wheel-shadow"></div>

                <canvas id="wheel" width="900" height="900">
                </canvas>

                <button class="spin-button" id="spinButton">

                    <div class="spin-icon">✣</div>

                    <span>Spin</span>

                </button>

                <div class="pointer"></div>

            </div>

        </section>


        <!-- =========================
         NAME EDITOR
    ========================== -->

        <aside class="control-panel">
        
            <div class="control-panel-scroll">
        
                <h2>Wheel of Names</h2>
        
                <p class="subtitle">
                    Add or remove participants and spin the wheel to randomly choose a winner.
                </p>
        
                <div class="input-row">
                    <input type="text" id="nameInput" placeholder="Enter a name..." maxlength="35" />
        
                    <button class="add-btn" id="addButton">
                        Add
                    </button>
                </div>
        
                <div class="names-title">
        
                    <h3>Participants</h3>
        
                    <span class="name-count" id="nameCount">
                        0
                    </span>
        
                </div>
        
                <div class="names-list" id="namesList">
                </div>
        
            </div>
        
        </aside>

    </main>

    <audio id="winnerSound" preload="auto">
        <source src="/fahhhhh.mp3" type="audio/mpeg">
    </audio>

    <!-- =========================
       WINNER POPUP
  ========================== -->

    <div class="popup-overlay" id="popupOverlay">

        <div class="popup">

            <div class="winner-icon">
                🏆
            </div>

            <h4>The wheel selected</h4>

            <div class="winner-name" id="winnerName">
                Winner
            </div>

            <button class="close-popup" id="closePopup">
                Continue
            </button>

        </div>

    </div>


    <script>

        /* ==========================================
           DATA
        =========================================== */

        let names = [
            "Sherlock Holmes",
            "Elizabeth Bennet",
            "Jay Gatsby",
            "Hermione Granger",
            "Atticus Finch",
            "Huckleberry Finn",
            "Jane Eyre",
            "Frodo Baggins",
            "Harry Potter",
            "Katniss Everdeen"
        ];


        /*
          Same style of repeating colors
          as the wheel in your reference.
        */

        const colors = [
            "#ef4148",
            "#ff7416",
            "#f2bc08",
            "#20c562",
            "#3d83ed",
            "#9a4ced"
        ];


        /* ==========================================
           DOM ELEMENTS
        =========================================== */

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const spinButton =
            document.getElementById("spinButton");

        const addButton =
            document.getElementById("addButton");

        const nameInput =
            document.getElementById("nameInput");

        const namesList =
            document.getElementById("namesList");

        const nameCount =
            document.getElementById("nameCount");

        const popupOverlay =
            document.getElementById("popupOverlay");

        const winnerName =
            document.getElementById("winnerName");

        const closePopup =
            document.getElementById("closePopup");


        /* ==========================================
           WHEEL VARIABLES
        =========================================== */

        const centerX =
            canvas.width / 2;

        const centerY =
            canvas.height / 2;

        const radius =
            canvas.width * 0.42;

        let currentRotation = 0;

        let spinning = false;


        /* ==========================================
           DRAW WHEEL
        =========================================== */

        function drawWheel() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            if (names.length === 0) {

                drawEmptyWheel();

                return;
            }


            const sliceAngle =
                (Math.PI * 2) / names.length;


            /*
              White exterior ring
            */

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                radius + 35,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#ffffff";

            ctx.fill();


            /*
              Gray dots around wheel
            */

            drawOuterDots();


            /*
              Rotate all wheel segments
            */

            ctx.save();

            ctx.translate(
                centerX,
                centerY
            );

            ctx.rotate(
                currentRotation
            );

            ctx.translate(
                -centerX,
                -centerY
            );


            names.forEach((name, index) => {

                /*
                  Offset by half a segment.
        
                  This means the center of one segment
                  initially points directly right toward
                  the pointer.
                */

                const startAngle =
                    index * sliceAngle -
                    sliceAngle / 2;

                const endAngle =
                    startAngle +
                    sliceAngle;


                /* Segment */

                ctx.beginPath();

                ctx.moveTo(
                    centerX,
                    centerY
                );

                ctx.arc(
                    centerX,
                    centerY,
                    radius,
                    startAngle,
                    endAngle
                );

                ctx.closePath();

                ctx.fillStyle =
                    colors[index % colors.length];

                ctx.fill();


                /* Divider */

                ctx.strokeStyle =
                    "#ffffff";

                ctx.lineWidth = 7;

                ctx.stroke();


                /*
                  Text
                */

                drawText(
                    name,
                    index,
                    startAngle,
                    endAngle
                );

            });


            ctx.restore();


            /*
              Center circle behind button.
            */

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                radius * 0.2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "#ffffff";

            ctx.fill();

        }


    /* ==========================================
               Helper function for drawtext
            =========================================== */

    function getSharedFontSize() {

        let fontSize = 34;
        const minFontSize = 16;

        /*
          Maximum space allowed for text.
          Adjust this if you want names
          slightly larger or smaller.
        */
        const maxTextWidth = radius * 0.48;

        /*
          General starting size based
          on number of segments.
        */
        if (names.length >= 12) {
            fontSize = 30;
        }

        if (names.length >= 16) {
            fontSize = 25;
        }

        if (names.length >= 22) {
            fontSize = 20;
        }

        /*
          Find ONE font size that allows
          EVERY name to fit.
        */
        while (fontSize > minFontSize) {

            ctx.font = `500 ${fontSize}px Arial`;

            const allNamesFit = names.every(name => {
                return ctx.measureText(name).width <= maxTextWidth;
            });

            if (allNamesFit) {
                break;
            }

            fontSize--;
        }

        return fontSize;
    }

        /* ==========================================
           DRAW TEXT
        =========================================== */

   function drawText(
        text,
        index,
        startAngle,
        endAngle
    ) {

        const middleAngle =
            (startAngle + endAngle) / 2;

        const textRadius =
            radius * 0.66;


        ctx.save();

        ctx.translate(
            centerX,
            centerY
        );

        ctx.rotate(
            middleAngle
        );

        ctx.translate(
            textRadius,
            0
        );


        /*
          Flip text on left side
          so it stays readable.
        */
        const normalizedAngle =
            normalizeAngle(
                middleAngle
            );

        if (
            normalizedAngle > Math.PI / 2 &&
            normalizedAngle < Math.PI * 1.5
        ) {
            ctx.rotate(Math.PI);
        }


        /*
          SAME FONT SIZE FOR ALL NAMES
        */
        const fontSize =
            getSharedFontSize();


        ctx.font =
            `500 ${fontSize}px Arial`;

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        /*
          Text color
        */
        const backgroundColor =
            colors[
            index %
            colors.length
            ];


        if (
            backgroundColor === "#f2bc08"
        ) {

            ctx.fillStyle =
                "#111111";

        } else {

            ctx.fillStyle =
                "#ffffff";

        }


        /*
          Draw full name.
          No shortening.
        */
        ctx.fillText(
            text,
            0,
            0
        );


        ctx.restore();
    }

        /* ==========================================
           OUTER DOTS
        =========================================== */

        function drawOuterDots() {

            /*
              Number of decorative dots.
            */

            const dotCount =
                Math.max(names.length * 3, 30);


            const dotRadius =
                radius + 27;


            for (
                let i = 0;
                i < dotCount;
                i++
            ) {

                const angle =
                    (Math.PI * 2 / dotCount) * i;


                const x =
                    centerX +
                    Math.cos(angle) *
                    dotRadius;


                const y =
                    centerY +
                    Math.sin(angle) *
                    dotRadius;


                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    8,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    "#737373";

                ctx.fill();

            }

        }


        /* ==========================================
           EMPTY WHEEL
        =========================================== */

        function drawEmptyWheel() {

            ctx.beginPath();

            ctx.arc(
                centerX,
                centerY,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#e5e7eb";

            ctx.fill();


            ctx.fillStyle =
                "#6b7280";

            ctx.font =
                "600 35px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "Add some names",
                centerX,
                centerY
            );

        }


        /* ==========================================
           SPIN WHEEL
        =========================================== */

        function spinWheel() {

            if (spinning) {
                return;
            }


            if (names.length < 2) {

                alert(
                    "Please add at least 2 names before spinning."
                );

                return;
            }


            spinning = true;

            spinButton.disabled = true;

            addButton.disabled = true;

            nameInput.disabled = true;


            /*
              Random number of complete rotations.
            */

            const fullSpins =
                6 + Math.floor(
                    Math.random() * 4
                );


            /*
              Random final stopping location.
            */

            const randomAngle =
                Math.random() *
                Math.PI * 2;


            const startRotation =
                currentRotation;


            const targetRotation =
                currentRotation +
                fullSpins *
                Math.PI *
                2 +
                randomAngle;


            /*
              5 to 7 seconds produces a similar
              smooth slow-down to the video.
            */

            const duration =
                5000 +
                Math.random() *
                2000;


            const startTime =
                performance.now();


            function animate(
                currentTime
            ) {

                const elapsed =
                    currentTime -
                    startTime;


                const progress =
                    Math.min(
                        elapsed / duration,
                        1
                    );


                /*
                  Cubic easing.
        
                  Fast at the beginning,
                  very slow toward the end.
                */

                const easedProgress =
                    1 -
                    Math.pow(
                        1 - progress,
                        4
                    );


                currentRotation =
                    startRotation +
                    (
                        targetRotation -
                        startRotation
                    ) *
                    easedProgress;


                drawWheel();


                if (progress < 1) {

                    requestAnimationFrame(
                        animate
                    );

                } else {

                    currentRotation =
                        normalizeAngle(
                            currentRotation
                        );


                    drawWheel();


                    spinning = false;

                    spinButton.disabled =
                        false;

                    addButton.disabled =
                        false;

                    nameInput.disabled =
                        false;


                    const winner =
                        calculateWinner();


                    /*
                      Small pause after wheel stops
                      before showing popup.
                    */

                    setTimeout(
                        () => {
                             // Play sound
                            const winnerSound =
                                document.getElementById("winnerSound");

                            winnerSound.currentTime = 0;

                            winnerSound.play().catch(error => {
                                console.log("Audio could not play:", error);
                            });

                            showWinner(
                                winner
                            );

                        },
                        450
                    );

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        /* ==========================================
           CALCULATE WINNER
        =========================================== */

        function calculateWinner() {

            const sliceAngle =
                Math.PI *
                2 /
                names.length;


            /*
              Pointer is located at 0 radians,
              meaning directly to the right.
      
              We calculate which original segment
              has rotated underneath that position.
            */

            let pointerAngle =
                normalizeAngle(
                    -currentRotation
                );


            /*
              Our first segment begins half a slice
              above the pointer.
      
              So add half a slice before determining
              the index.
            */

            pointerAngle =
                normalizeAngle(
                    pointerAngle +
                    sliceAngle / 2
                );


            let winnerIndex =
                Math.floor(
                    pointerAngle /
                    sliceAngle
                );


            winnerIndex =
                winnerIndex %
                names.length;


            return names[
                winnerIndex
            ];

        }


        /* ==========================================
           ANGLE HELPER
        =========================================== */

        function normalizeAngle(
            angle
        ) {

            const fullCircle =
                Math.PI * 2;


            return (
                (
                    angle %
                    fullCircle
                ) +
                fullCircle
            ) %
                fullCircle;

        }


        /* ==========================================
           POPUP
        =========================================== */

        function showWinner(
            winner
        ) {

            winnerName.textContent =
                winner;


            popupOverlay.classList.add(
                "active"
            );

        }


        function hideWinner() {

            popupOverlay.classList.remove(
                "active"
            );

        }


        /* ==========================================
           RENDER NAME LIST
        =========================================== */

        function renderNames() {

            namesList.innerHTML = "";


            names.forEach(
                (name, index) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "name-item";


                    const dot =
                        document.createElement(
                            "div"
                        );


                    dot.className =
                        "color-dot";


                    dot.style.background =
                        colors[
                        index %
                        colors.length
                        ];


                    const text =
                        document.createElement(
                            "span"
                        );


                    text.className =
                        "name-text";


                    text.textContent =
                        name;


                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.className =
                        "delete-btn";


                    deleteButton.innerHTML =
                        "×";


                    deleteButton.title =
                        "Delete name";


                    deleteButton.addEventListener(
                        "click",
                        () => {

                            deleteName(
                                index
                            );

                        }
                    );


                    item.appendChild(
                        dot
                    );

                    item.appendChild(
                        text
                    );

                    item.appendChild(
                        deleteButton
                    );


                    namesList.appendChild(
                        item
                    );

                }
            );


            nameCount.textContent =
                names.length;


            drawWheel();

        }


        /* ==========================================
           ADD NAME
        =========================================== */

        function addName() {

            if (spinning) {
                return;
            }


            const name =
                nameInput.value.trim();


            if (!name) {
                return;
            }


            names.push(
                name
            );


            nameInput.value =
                "";


            renderNames();


            nameInput.focus();

        }


        /* ==========================================
           DELETE NAME
        =========================================== */

        function deleteName(
            index
        ) {

            if (spinning) {
                return;
            }


            names.splice(
                index,
                1
            );


            renderNames();

        }


        /* ==========================================
           EVENT LISTENERS
        =========================================== */

        spinButton.addEventListener(
            "click",
            spinWheel
        );


        addButton.addEventListener(
            "click",
            addName
        );


        nameInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    addName();

                }

            }
        );


        closePopup.addEventListener(
            "click",
            hideWinner
        );


        popupOverlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    popupOverlay
                ) {

                    hideWinner();

                }

            }
        );


        /*
          Initial render.
        */

        renderNames();

    </script>

</body>

</html>
